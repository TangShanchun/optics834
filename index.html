window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});

$('filters').addEventListener('click',function(e){var b=e.target.closest('.fbtn');if(!b)return;st.ui.filter=b.dataset.f;save();applyFilter();window.scrollTo(0,0);});
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;st.ui.book=b.dataset.book;save();applyFilter();window.scrollTo(0,0);});
var qT;$('q').addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(applyFilter,150);});

$('btn-exp').addEventListener('click',function(){
 var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
 var name='834刷题表备份-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json';
 var data=JSON.stringify({app:'834光学刷题表',v:1,exported:d.toISOString(),items:st.items},null,1);
 var blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
 toast('已导出：'+name+'（在“下载”里）');});
$('file-imp').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var fr=new FileReader();
 fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||typeof o.items!=='object')throw 0;
   var n=0,items={};for(var id in o.items){var r=o.items[id];if(!r)continue;var x={a:+r.a|0,b:+r.b|0,n:String(r.n||'')};if(x.a<0||x.a>3)x.a=0;if(x.b<0||x.b>3)x.b=0;items[id]=x;n++;}
   if(!confirm('导入这个备份？会用备份里的 '+n+' 条记录覆盖现在的进度。'))return;
   st.items=items;save();paintAll();toast('已导入 '+n+' 条记录');}catch(err){alert('这个文件不是刷题表的备份，导入失败。');}
   e.target.value='';};
 fr.readAsText(f);});
$('btn-clr').addEventListener('click',function(){if(!confirm('确定清空全部进度和备注吗？清空后无法恢复。建议先导出备份。'))return;st.items={};save();paintAll();toast('进度已清空');});

paintAll();
})();
</script>
</body>
</html>
